name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from package.json#packageManager, so CI, Vercel
      # and local dev all resolve the lockfile the same way.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm astro check
      # No database needed: LIBSQL_URL is read at runtime, not at build time.
      - run: pnpm build
